<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration</title></head>
<body>
<h1>Student Registration Form</h1>
<form action="#" method="post">
<label>Full name: <input type="text" name="name" required></label><br><br>
<label>Email: <input type="email" name="email" required></label><br><br>
<label>Course:
<select name="course"><option>BCA</option><option>BSc Computer Science</option><option>BBA</option></select>
</label><br><br>
<label>Gender: <input type="radio" name="gender" value="female"> Female <input type="radio" name="gender" value="male"> Male</label><br><br>
<label><input type="checkbox" name="terms" required> I accept the terms</label><br><br>
<button type="submit">Register</button> <button type="reset">Reset</button>
</form>
</body>
</html>
