<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #dceeff;
        }
    </style>
</head>
<body>
    <h1>Table with Merged Cells</h1>

    <table>
        <caption>Web Development Workshop</caption>
        <tr>
            <th colspan="3">Workshop Schedule</th>
        </tr>
        <tr>
            <th>Day</th>
            <th>Topic</th>
            <th>Room</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>HTML</td>
            <td>A101</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>A101</td>
        </tr>
    </table>
</body>
</html>
