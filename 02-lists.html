<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <h1>HTML Lists</h1>

    <h2>Ordered List</h2>
    <ol>
        <li>Plan the webpage</li>
        <li>Write the HTML code</li>
        <li>Test the webpage</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Defines the structure of a webpage.</dd>
        <dt>CSS</dt>
        <dd>Defines the style of a webpage.</dd>
    </dl>
</body>
</html>
