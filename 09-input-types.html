<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HTML5 Input Types</title></head>
<body>
<h1>HTML5 Input Types</h1>
<form>
<label>Email: <input type="email" placeholder="student@example.com"></label><br><br>
<label>Password: <input type="password" minlength="8"></label><br><br>
<label>Date of birth: <input type="date"></label><br><br>
<label>Credits: <input type="number" min="1" max="30" value="6"></label><br><br>
<button type="submit">Submit</button>
</form>
</body>
</html>
