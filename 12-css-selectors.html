<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Selectors and Box Model</title><style>

</style></head>
<body>
<h1>CSS Selectors, Colors and Box Model</h1>
<p class="notice">This uses an element selector, class selector, ID selector, attribute selector, colors, fonts, and background.</p>
<p id="special">This text uses an ID selector.</p>
<div class="card">Content area<br>Padding: 24px<br>Border: 4px<br>Margin: 20px</div>
